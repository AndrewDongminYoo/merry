name: Publish to pub.dev

on:
  push:
    tags:
      - v[0-9]*.[0-9]*.[0-9]*

permissions:
  contents: read

env:
  # Actions will be forced to run with Node.js 24 by default starting June 2nd, 2026.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Verification never pushes; do not leave a credential in
          # .git/config while it runs.
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      # Nothing here compiles native/, so a release would happily ship blobs
      # built from older sources.
      - name: Verify blobs match native sources
        run: .github/scripts/check-blobs.sh

      - name: Install dependencies
        run: dart pub get

      - name: Run tests
        run: dart test

  publish:
    needs: test
    environment: pub.dev
    permissions:
      contents: read
      id-token: write # This is required for authentication using OIDC
    runs-on: ubuntu-latest
    steps:
      # Defense in depth: the tag glob above is looser than semver, so reject
      # anything that is not exactly vMAJOR.MINOR.PATCH before publishing.
      - name: Validate release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Publishing authenticates to pub.dev over OIDC, not the git
          # credential, so the checkout does not need to keep one.
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Publish
        run: dart pub publish --force
