on:
  pull_request:
  push:
    branches:
      - main

name: Verify

permissions:
  contents: read

env:
  # Actions will be forced to run with Node.js 24 by default starting June 2nd, 2026.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  blobs:
    name: Blobs match native sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The blob checks never push; do not leave a credential in
          # .git/config while they run.
          persist-credentials: false

      - run: .github/scripts/check-blobs_test.sh

      # Catches a native/ change merging without its blob rebuild. The same
      # check gates publishing, but a red PR says so before it reaches a tag.
      - run: .github/scripts/check-blobs.sh

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The suite never pushes; do not leave a credential in .git/config
          # while it runs.
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - run: dart pub get

      # The suite also runs in publish.yml, but that only fires on a v* tag, so
      # until now a regression could reach main and only surface at release.
      - run: dart test

  native:
    name: Native crate builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build never pushes; do not leave a credential in .git/config
          # while it runs.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      # build.yml compiles the blobs only on manual dispatch, so a Rust change
      # (a cargo Dependabot bump included) never compiled on a PR. The blob check
      # above still fails until the blobs are rebuilt; this says whether they can be.
      - run: cargo build --locked --manifest-path native/Cargo.toml
