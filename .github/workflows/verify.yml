on:
  pull_request:
  push:
    branches:
      - main

name: Verify

permissions:
  contents: read

env:
  # Actions will be forced to run with Node.js 24 by default starting June 2nd, 2026.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  blobs:
    name: Blobs match native sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: .github/scripts/check-blobs_test.sh

      # Catches a native/ change merging without its blob rebuild. The same
      # check gates publishing, but a red PR says so before it reaches a tag.
      - run: .github/scripts/check-blobs.sh

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The suite never pushes; do not leave a credential in .git/config
          # while it runs.
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1

      - run: dart pub get

      # The suite also runs in publish.yml, but that only fires on a v* tag, so
      # until now a regression could reach main and only surface at release.
      - run: dart test
